<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Hospital Management System - Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f7fb;
        }

        .login-container {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        .logo p {
            color: #6b7280;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .login-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            background: #1d4ed8;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 10px;
            border-radius: 7px;
            margin-bottom: 20px;
            font-size: 14px;
        }

    </style>

</head>

<body>

<div class="login-container">

    <div class="logo">

        <h1>Hospital Management</h1>

        <p>Sign in to access your dashboard</p>

    </div>


    {% if form.errors %}

        <div class="error">
            Username or password is incorrect.
        </div>

    {% endif %}


    <form method="post">

        {% csrf_token %}

        <div class="form-group">

            <label for="id_username">
                Username
            </label>

            <input
                type="text"
                name="username"
                id="id_username"
                placeholder="Enter username"
                required
                autofocus
            >

        </div>


        <div class="form-group">

            <label for="id_password">
                Password
            </label>

            <input
                type="password"
                name="password"
                id="id_password"
                placeholder="Enter password"
                required
            >

        </div>


        <input
            type="hidden"
            name="next"
            value="{{ next }}"
        >


        <button
            type="submit"
            class="login-button"
        >
            Login
        </button>

    </form>

</div>

</body>

</html>
